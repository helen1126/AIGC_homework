<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI动漫头像生成</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🎨 AI动漫头像生成</h1>
        <p class="subtitle">基于Stable Diffusion的动漫风格头像生成演示</p>
    </header>

    <main>
        <section class="config-panel">
            <div class="panel-section">
                <h2>📝 角色描述</h2>
                <textarea id="description" placeholder="描述你想要生成的动漫角色，如：一位勇敢的女骑士，手持发光的剑" rows="3"></textarea>
            </div>

            <div class="panel-section">
                <h2>🎭 动漫风格</h2>
                <div id="style-options" class="option-grid"></div>
            </div>

            <div class="panel-section">
                <h2>👤 角色特征</h2>
                <div id="feature-options"></div>
            </div>

            <div class="panel-section">
                <h2>🤖 模型选择</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label for="sd-model">SD模型</label>
                        <select id="sd-model">
                            <option value="">默认模型</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="lora-model">LoRA模型</label>
                        <select id="lora-model">
                            <option value="">不使用LoRA</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="lora-weight">LoRA权重: <span id="lora-weight-val">1.0</span></label>
                        <input type="range" id="lora-weight" min="0" max="2" step="0.1" value="1.0">
                    </div>
                </div>
            </div>

            <div class="panel-section">
                <h2>⚙️ 生成参数</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label for="resolution">分辨率</label>
                        <select id="resolution"></select>
                    </div>
                    <div class="form-group">
                        <label for="quality-mode">质量模式</label>
                        <select id="quality-mode">
                            <option value="fast">快速</option>
                            <option value="balanced" selected>平衡</option>
                            <option value="quality">高质量</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="seed">随机种子</label>
                        <input type="number" id="seed" value="-1" min="-1" max="4294967295">
                    </div>
                </div>
            </div>

            <div class="panel-section">
                <div class="form-row">
                    <div class="form-group">
                        <label for="user-id">用户标识</label>
                        <input type="text" id="user-id" value="demo_user" maxlength="100">
                    </div>
                    <div class="form-group generate-group">
                        <button id="generate-btn" class="btn-generate" onclick="generateAvatar()">
                            ✨ 生成头像
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <section class="result-panel">
            <h2>🖼️ 生成结果</h2>
            <div id="result-container" class="result-container">
                <div id="placeholder" class="placeholder">
                    <p>👈 配置参数后点击"生成头像"</p>
                </div>
                <div id="loading" class="loading" style="display:none;">
                    <div class="spinner"></div>
                    <p>正在生成中，请稍候...</p>
                </div>
                <div id="result" style="display:none;">
                    <img id="result-image" src="" alt="生成的头像">
                    <div id="result-info" class="result-info"></div>
                </div>
                <div id="error" class="error" style="display:none;"></div>
            </div>
        </section>
    </main>

    <footer>
        <p>AI动漫头像生成服务 v2.0 | <a href="/docs" target="_blank">API文档</a></p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
