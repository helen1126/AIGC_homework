<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stable Diffusion Studio</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav
      class="navbar navbar-expand-lg navbar-dark bg-dark-gradient mb-4 shadow"
    >
      <div class="container">
        <a class="navbar-brand" href="#">
          <i class="bi bi-cpu-fill me-2"></i>SD 生成工作站
        </a>
        <div class="d-flex align-items-center">
          <span id="connection-status" class="badge bg-secondary me-2"
            >检查连接...</span
          >
          <button
            id="refresh-all-models"
            class="btn btn-outline-light btn-sm"
            title="刷新模型列表"
          >
            <i class="bi bi-arrow-clockwise"></i>
          </button>
        </div>
      </div>
    </nav>

    <div class="container">
      <div class="row g-4">
        <!-- 左侧配置面板 -->
        <div class="col-lg-4">
          <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-white py-3">
              <h5 class="mb-0">
                <i class="bi bi-pencil-square me-2 text-primary"></i>提示词配置
              </h5>
            </div>
            <div class="card-body">
              <div class="mb-3">
                <label class="form-label fw-bold">正向提示词 (Prompt)</label>
                <textarea
                  id="prompt"
                  class="form-control"
                  rows="4"
                  placeholder="描述你想要看到的画面..."
                ></textarea>
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold text-muted"
                  >反向提示词 (Negative)</label
                >
                <textarea
                  id="negative_prompt"
                  class="form-control"
                  rows="2"
                  placeholder="不希望出现的内容..."
                ></textarea>
              </div>
            </div>
          </div>

          <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-white py-3">
              <h5 class="mb-0">
                <i class="bi bi-layers me-2 text-primary"></i>模型选择
              </h5>
            </div>
            <div class="card-body">
              <div class="mb-3">
                <label class="form-label">SD 基础模型</label>
                <select id="sd_model" class="form-select"></select>
              </div>
              <div class="mb-3">
                <label class="form-label">LoRA 模型 (可选)</label>
                <select id="lora_model" class="form-select"></select>
              </div>
              <div class="mb-1 d-flex justify-content-between">
                <label class="form-label">LoRA 权重</label>
                <span id="lora_weight_val" class="text-primary fw-bold"
                  >1.0</span
                >
              </div>
              <input
                type="range"
                class="form-range"
                id="lora_weight"
                min="0"
                max="2"
                step="0.1"
                value="1.0"
              />
            </div>
          </div>

          <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-white py-3">
              <h5 class="mb-0">
                <i class="bi bi-sliders me-2 text-primary"></i>参数设置
              </h5>
            </div>
            <div class="card-body">
              <div class="row">
                <div class="col-6 mb-3">
                  <label class="form-label small text-muted">宽度</label>
                  <input
                    type="number"
                    id="width"
                    class="form-control"
                    value="512"
                  />
                </div>
                <div class="col-6 mb-3">
                  <label class="form-label small text-muted">高度</label>
                  <input
                    type="number"
                    id="height"
                    class="form-control"
                    value="512"
                  />
                </div>
              </div>
              <div class="mb-3">
                <label
                  class="form-label small text-muted d-flex justify-content-between"
                >
                  推理步数 <span id="steps_val">20</span>
                </label>
                <input
                  type="range"
                  class="form-range"
                  id="num_inference_steps"
                  min="1"
                  max="100"
                  value="20"
                />
              </div>
              <div class="mb-3">
                <label class="form-label small text-muted"
                  >采样器 (Scheduler)</label
                >
                <select id="scheduler" class="form-select form-select-sm">
                  <option value="euler_a">Euler Ancestral (推荐)</option>
                  <option value="euler">Euler</option>
                  <option value="dpm++2m_karras">DPM++ 2M Karras</option>
                  <option value="ddim">DDIM</option>
                </select>
              </div>
              <div class="input-group mb-3">
                <span class="input-group-text small">种子</span>
                <input
                  type="number"
                  id="seed"
                  class="form-control"
                  value="-1"
                />
                <button
                  class="btn btn-outline-secondary"
                  type="button"
                  onclick="document.getElementById('seed').value = -1"
                >
                  随机
                </button>
              </div>
              <button
                id="generate-btn"
                class="btn btn-primary w-100 py-2 fw-bold shadow-sm"
              >
                <i class="bi bi-lightning-charge-fill me-1"></i> 开始生成
              </button>
            </div>
          </div>
        </div>

        <!-- 右侧展示面板 -->
        <div class="col-lg-8">
          <div class="card shadow-sm border-0 h-100 min-vh-75">
            <div
              class="card-body d-flex flex-column align-items-center justify-content-center bg-light-soft position-relative"
            >
              <!-- 加载中遮罩 -->
              <div id="loader" class="loader-overlay d-none">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-3 fw-bold text-primary">
                  AI 正在绘制中，请稍候...
                </p>
              </div>

              <!-- 初始占位图/生成结果 -->
              <div id="result-placeholder" class="text-center text-muted">
                <i class="bi bi-image-fill display-1 mb-3 opacity-25"></i>
                <p>生成的图片将在这里显示</p>
              </div>

              <img
                id="result-image"
                class="img-fluid rounded shadow-lg d-none"
                alt="生成结果"
              />

              <!-- 底部工具栏 -->
              <div id="image-actions" class="mt-4 d-none">
                <div class="btn-group shadow-sm">
                  <button id="download-btn" class="btn btn-light">
                    <i class="bi bi-download me-1"></i> 下载
                  </button>
                  <button id="copy-btn" class="btn btn-light">
                    <i class="bi bi-clipboard me-1"></i> 复制
                  </button>
                  <button id="show-params-btn" class="btn btn-light">
                    <i class="bi bi-info-circle me-1"></i> 参数
                  </button>
                </div>
              </div>
            </div>
            <div
              id="params-display"
              class="card-footer bg-white border-top-0 d-none"
            >
              <small
                class="text-muted text-break"
                id="result-params-text"
              ></small>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
