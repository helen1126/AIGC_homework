resolution_presets:
  low:
    width: 256
    height: 256
    label: "低分辨率 (256x256)"
    description: "快速生成，适合预览"

  medium:
    width: 512
    height: 512
    label: "中等分辨率 (512x512)"
    description: "平衡质量和速度"

  high:
    width: 768
    height: 768
    label: "高分辨率 (768x768)"
    description: "较高质量，需要更多时间"

  ultra:
    width: 1024
    height: 1024
    label: "超高分辨率 (1024x1024)"
    description: "最高质量，生成时间较长"