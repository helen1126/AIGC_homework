styles:
  japanese:
    name: "日系动漫"
    description: "经典日式动漫风格，细腻的线条和柔和的色彩"
    prompt_prefix: "anime style, Japanese anime, detailed anime art, "
    prompt_suffix: ", high quality, masterpiece, best quality, vibrant colors"
    negative_suffix: ", realistic, 3d render, photo"
    quality_tags:
      - "masterpiece"
      - "best quality"
      - "ultra-detailed"
      - "illustration"
    style_strength: 1.0

  american_comic:
    name: "美漫风格"
    description: "美式漫画风格，粗犷的线条和强烈的对比"
    prompt_prefix: "American comic style, comic book art, bold lines, "
    prompt_suffix: ", dynamic composition, dramatic lighting, ink style"
    negative_suffix: ", anime, manga, soft shading"
    quality_tags:
      - "comic book"
      - "graphic novel"
      - "bold outlines"
      - "dynamic"
    style_strength: 0.9

  chibi_q:
    name: "Q版萌系"
    description: "可爱Q版风格，夸张的比例和大眼睛设计"
    prompt_prefix: "chibi style, cute chibi, super deformed, big eyes, "
    prompt_suffix: ", adorable, kawaii, pastel colors, soft shading"
    negative_suffix: ", realistic, detailed anatomy, serious expression"
    quality_tags:
      - "chibi"
      - "kawaii"
      - "cute"
      - "adorable"
      - "super deformed"
    style_strength: 1.1

  watercolor:
    name: "水彩风"
    description: "水彩画风格的动漫艺术，柔和的色彩过渡"
    prompt_prefix: "watercolor painting style, soft watercolors, artistic, "
    prompt_suffix: ", flowing colors, delicate brushstrokes, ethereal atmosphere"
    negative_suffix: ", digital art, sharp lines, photorealistic"
    quality_tags:
      - "watercolor"
      - "painting"
      - "artistic"
      - "soft"
      - "ethereal"
    style_strength: 0.95

  cyberpunk:
    name: "赛博朋克"
    description: "未来科技感的赛博朋克风格，霓虹色彩和机械元素"
    prompt_prefix: "cyberpunk style, neon lights, futuristic, sci-fi, "
    prompt_suffix: ", high-tech, digital art, glowing effects, dark background"
    negative_suffix: ", traditional, natural, soft colors, vintage"
    quality_tags:
      - "cyberpunk"
      - "futuristic"
      - "neon"
      - "sci-fi"
      - "high-tech"
    style_strength: 1.0

  pixel_art:
    name: "像素艺术"
    description: "复古像素风格，8位/16位游戏美术风格"
    prompt_prefix: "pixel art style, retro game art, 16-bit graphics, "
    prompt_suffix: ", pixel perfect, retro gaming aesthetic, limited color palette"
    negative_suffix: ", smooth, high resolution, photorealistic, modern"
    quality_tags:
      - "pixel art"
      - "retro"
      - "8-bit"
      - "16-bit"
      - "game art"
    style_strength: 1.05

